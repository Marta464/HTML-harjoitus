let numbers = [];

for (let i = 0; i < 5; i++) {
    let input = Number(prompt(`Anna luku ${i + 1} / 5:`));
    numbers.push(input);
}

console.log("Numerot käänteisessä järjestyksessä:");

for (let i = numbers.length - 1; i >= 0; i--) {
    console.log(numbers[i]);
}
