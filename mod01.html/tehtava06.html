<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Tehtävä 6</title>
</head>
<body>
    <script>
        // Näytetään vahvistusikkuna
        const vastaus = confirm("Should I calculate the square root?");

        if (vastaus === true) {
            // Jos käyttäjä valitsi OK, kysytään luku
            const luku = parseFloat(prompt("Syötä luku:"));

            if (luku < 0) {
                // Negatiivisen luvun neliöjuurta ei voi laskea
                document.body.innerHTML += "<p>The square root of a negative number is not defined</p>";
            } else {
                // Lasketaan ja tulostetaan neliöjuuri
                const neliojuuri = Math.sqrt(luku);
                document.body.innerHTML += `<p>Luvun ${luku} neliöjuuri on ${neliojuuri}</p>`;
            }
        } else {
            // Jos käyttäjä valitsi Cancel
            document.body.innerHTML += "<p>The square root is not calculated.</p>";
        }
    </script>
</body>
</html>
